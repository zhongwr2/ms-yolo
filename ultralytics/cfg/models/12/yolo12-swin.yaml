# YOLO12 object detection model with Swin Transformer backbone integration
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect
# Enhanced with Swin Transformer V2 blocks for improved feature extraction

# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n-Swin.yaml' will call yolo12-Swin.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.25, 0.50, 1024] # nano: lighter Swin blocks
  s: [0.50, 0.50, 1024] # small: standard Swin blocks
  m: [0.50, 1.00, 1024] # medium: enhanced Swin blocks
  l: [1.00, 1.00, 1024] # large: deeper Swin blocks
  x: [1.00, 1.50, 1024] # xlarge: very deep Swin blocks

# YOLO12n backbone with Swin Transformer integration
# Swin Blocks are inserted at strategic points for enhanced feature representation
backbone:
  # [from, repeats, module, args]
  # Stage 1: Patch Embedding at L1/4
  - [-1, 1, PatchEmbed, [128]]                  # 0: embed_dim [160,160,128]
  - [-1, 4, SwinBlockYOLO, [128, 160, 320]]        # 1: dim, input_resolution, window_size 

  # # Stage 2 at L2/8
  - [-1, 1, PatchMerging, [256, [160,160]]]    # 2: downsample to [80,80,256]
  - [-1, 4, SwinBlockYOLO, [256, 80, 320]]       # 3: dim, input_resolution, window_size
  
  # # Stage 3 at L3/16
  - [-1, 1, PatchMerging, [512, [80,80]]]      # 4: downsample to [40,40,512]
  - [-1, 4, SwinBlockYOLO, [512, 40, 320]]       # 5: dim, input_resolution, window_size
  # # Stage 4 at L4/32
  - [-1, 1, PatchMerging, [1024, [40,40]]]    # 6: downsample to [20,20,1024]
  - [-1, 4, SwinBlockYOLO, [1024, 20, 320]]     # 7: dim, input_resolution, window_size
  - [-1, 1, SPPF, [1024, 5]]                    # 8

# YOLO12n head with Swin feature refinement
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]                   # cat backbone L3
  - [-1, 4, SwinBlockYOLO, [512, 40, 320]]      # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]                  # cat backbone L2    
  - [-1, 4, SwinBlockYOLO, [256, 80, 320]]   # 14 -> P4                

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]                  # cat backbone L1    
  - [-1, 4, SwinBlockYOLO, [128, 160, 320]]      # 17 -> P3

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] 
  - [-1, 4, SwinBlockYOLO, [256, 80, 320]] 

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] 
  - [-1, 4, SwinBlockYOLO, [512, 40, 320]] 

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat C5
  - [-1, 4, SwinBlockYOLO, [1024, 20, 320]]     # 26 -> P6

  - [[17, 20, 23, 26], 1, Detect, [nc]]             # Detect(P3, P4, P5)
