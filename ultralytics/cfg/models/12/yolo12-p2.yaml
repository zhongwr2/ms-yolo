# =============================================================================
# Baseline (d): YOLOv12 + P2 detection branch
# =============================================================================
# ISI reviewer request (IMAVIS-D-26-02785, comment 1, final paragraph):
#   The P2 branch alone accounts for +4.5% mAP50 (Exp. a->b) in the MS-YOLO
#   ablation, yet P2 is a detector-agnostic technique. A YOLOv12 + P2 baseline
#   is therefore required to disentangle the contribution of the hybrid
#   backbone from that of the P2 branch.
#
# This config is identical to yolo12.yaml (CNN / Area-Attention backbone and
# full PAFPN head) with a stride-4 P2 detection branch appended to the top-down
# pathway, mirroring the standard PAN-with-P2 extension:
#   P3(top-down) --Upsample--> concat(C2, stride4) --> A2C2f --> P2 detect
#   P2 detect     --Conv s2--> concat(P3)          --> A2C2f --> P3 detect
# Detection head: {P2, P3, P4, P5}.
#
# Invoke as: --config ultralytics/cfg/models/12/yolo12m-p2.yaml
# =============================================================================

# Parameters
nc: 10 # number of classes (VisDrone2019)
scales: # model compound scaling constants, e.g. 'model=yolo12n-p2.yaml'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLOv12 backbone (unchanged)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  <- backbone P2 feature
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  <- backbone P3 feature
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6  <- backbone P4 feature
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLOv12 head + P2 branch (PAFPN + P2 detection)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 # 10
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 # 13
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15  P2 branch
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2 # 16
  # NOTE: C3k2 (not A2C2f) is used for the P2 neck. A2C2f asserts c2*0.5 % 32 == 0,
  # i.e. c2 must be a multiple of 64, which the nano scale (c2=32) violates.
  # C3k2 is also what YOLOv12 itself uses at the two highest-resolution stages.
  - [-1, 2, C3k2, [128, False]] # 17  (P2/4)

  - [-1, 1, Conv, [128, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # cat head P3 # 19
  - [-1, 2, A2C2f, [256, False, -1]] # 20  (P3/8)

  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 11], 1, Concat, [1]] # cat head P4 # 22
  - [-1, 2, A2C2f, [512, False, -1]] # 23  (P4/16)

  - [-1, 1, Conv, [512, 3, 2]] # 24
  - [[-1, 8], 1, Concat, [1]] # cat head P5 # 25
  - [-1, 2, C3k2, [1024, True]] # 26  (P5/32-large)

  - [[17, 20, 23, 26], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
