# =============================================================================
# Ablation (b): REVERSED allocation (Swin shallow / Mamba deep)
# =============================================================================
# ISI reviewer request (IMAVIS-D-26-02785, comment 1b):
#   Test the opposite scale-allocation hypothesis: Swin Transformer in the
#   shallow high-resolution stages (1-3) and Mamba (SS2DBlock) in the deep
#   stage (4). If the MS-YOLO principle is correct, this configuration should
#   under-perform the original Mamba-shallow / Swin-deep design.
#
# IMPORTANT - input_resolution must match the real feature-map size:
#   SwinTransformerBlock asserts Hx == H and Wx == W, so for the 640x640 fixed
#   input used in all MS-YOLO experiments the resolutions are:
#     Stage 1 -> 160x160, Stage 2 -> 80x80, Stage 3 -> 40x40.
#   Changing imgsz will crash this config (same constraint already applies to
#   the Stage-4 Swin in the MS-YOLO template).
#
# num_heads = 4 divides the Stage 1/2/3 channel dims at every scale:
#   128*w = {16,32,64,128}, 256*w = {32,64,128,256}, 512*w = {64,128,256,512}.
# =============================================================================

# Parameters
nc: 10 # number of classes
scales:
  # [depth, width, max_channels]
  n: [1.00, 0.125, 1024]
  s: [1.00, 0.25, 1024]
  m: [1.00, 0.50, 1024]
  l: [1.00, 1.00, 512]

# Reversed backbone: Swin shallow (Stages 1-3), Mamba deep (Stage 4)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SOPE, [128]]                                        # 0-P2/4
  - [-1, 4, SwinTransformerBasicLayer, [128, [160, 160], 4, 5]] # 1  Stage 1 = Swin

  - [-1, 1, VisionClueMerge, [256]]                             # 2  P3/8
  - [-1, 4, SwinTransformerBasicLayer, [256, [80, 80], 4, 5]]   # 3  Stage 2 = Swin

  - [-1, 1, VisionClueMerge, [512]]                             # 4  P4/16
  - [-1, 2, SwinTransformerBasicLayer, [512, [40, 40], 4, 5]]   # 5  Stage 3 = Swin

  - [-1, 1, VisionClueMerge, [1024]]                            # 6  P5/32
  - [-1, 2, SS2DBlock, [1024]]                                  # 7  Stage 4 = Mamba

# Simplified FPN (top-down only) + P2/P3/P4 detection
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 8
  - [[-1, 5], 1, Concat, [1]] # cat backbone P4             # 9
  - [-1, 1, C2f, [512]] # 10

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 11
  - [[-1, 3], 1, Concat, [1]] # cat backbone P3             # 12
  - [-1, 1, C2f, [256]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 14
  - [[-1, 1], 1, Concat, [1]] # cat backbone P2             # 15
  - [-1, 1, C2f, [128]] # 16

  - [[16, 13, 10], 1, Detect, [nc]] # Detect(P2, P3, P4)
