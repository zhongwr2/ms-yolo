# =============================================================================
# Ablation (a): ALL-MAMBA backbone (MS-YOLO without Swin Transformer)
# =============================================================================
# ISI reviewer request (IMAVIS-D-26-02785, comment 1a):
#   Isolate the contribution of the scale-adaptive hybrid backbone by replacing
#   the deep-stage Swin Transformer block with an equivalent Mamba (SS2DBlock)
#   stack, keeping P2 branch / simplified FPN / SOPE identical to MS-YOLO.
#
# Differences vs. the MS-YOLO template (yolo12-mamba-swin.yaml):
#   - backbone layer 7: SwinTransformerBasicLayer -> SS2DBlock (Stage 4 = Mamba)
#   Everything else (SOPE, VisionClueMerge, block counts 4/4/2/2, head, Detect
#   at P2/P3/P4) is unchanged so the only variable is the Stage-4 block type.
#
# Invoke as: --config ultralytics/cfg/models/mamba-swin/yolo12m-mamba-swin-all-mamba.yaml
#   (the trailing scale letter is stripped by Ultralytics; template name kept identical)
# =============================================================================

# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants, e.g. 'model=yolo12n-mamba-swin-all-mamba.yaml'
  # [depth, width, max_channels]
  n: [1.00, 0.125, 1024]
  s: [1.00, 0.25, 1024]
  m: [1.00, 0.50, 1024]
  l: [1.00, 1.00, 512]

# Mamba-Swin backbone (Stage 4 -> Mamba for this ablation)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SOPE, [128]]   # 0-P2/4                   # inp, embed_dim
  - [-1, 4, SS2DBlock, [128]]                               # 1

  - [-1, 1, VisionClueMerge, [256]]      # 2  P3/8
  - [-1, 4, SS2DBlock, [256]]              # 3

  - [-1, 1, VisionClueMerge, [512]]      # 4  P4/16
  - [-1, 2, SS2DBlock, [512]]              # 5

  - [-1, 1, VisionClueMerge, [1024]]      # 6  P5/32
  - [-1, 2, SS2DBlock, [1024]]            # 7  Stage 4 = Mamba (was SwinTransformerBasicLayer)

# Simplified FPN (top-down only) + P2/P3/P4 detection
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 8
  - [[-1, 5], 1, Concat, [1]] # cat backbone P4             # 9
  - [-1, 1, C2f, [512]] # 10

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 11
  - [[-1, 3], 1, Concat, [1]] # cat backbone P3             # 12
  - [-1, 1, C2f, [256]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 14
  - [[-1, 1], 1, Concat, [1]] # cat backbone P2             # 15
  - [-1, 1, C2f, [128]] # 16

  - [[16, 13, 10], 1, Detect, [nc]] # Detect(P2, P3, P4)
